name: Test - Unit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 7
    runs-on: ubuntu-latest

    # Unit tests import modules that read `src/utils/env`, which validates its
    # schema at module load. `.env.test` is gitignored, so CI has to supply
    # these. They are deliberately literal placeholders rather than secrets:
    # nothing here reaches a real service, and this keeps the job working on
    # pull requests from forks, which cannot read repository secrets.
    env:
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: mikebifulco-com
      NEXT_PUBLIC_FATHOM_ID: PAVJGIYJ
      NEXT_PUBLIC_POSTHOG_KEY: phc_unit_test_placeholder

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install deps (with cache)
        run: pnpm install

      # src/data/generated/*.json is gitignored and produced at build time, but
      # application modules import it directly, so unit tests need it present.
      - name: Generate build-time content data
        run: pnpm prebuild

      - name: Run unit tests
        run: pnpm test:unit --run
